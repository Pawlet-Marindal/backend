[build]
  functions = "netlify/functions"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"
  # NODE_ENV dan DB_NAME bukan kredensial. Scanner Netlify salah mendeteksi
  # nilai keduanya sebagai secret di README.md dan database/schema.sql.
  SECRETS_SCAN_OMIT_KEYS = "NODE_ENV,DB_NAME"

# Semua request /api/v1/* dilempar ke Function "api".
# Wrapper di netlify/functions/api.js normalisasi path ke route Express.
[[redirects]]
  from = "/api/v1/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
